<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ContentCam - Record vertical and horizontal at the same time</title>
  <meta name="description" content="ContentCam records a vertical and a horizontal video from the same take: one for Reels and TikTok, one for YouTube. Free to download on the App Store.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/assets/icon.png">
  <link rel="preload" as="image" href="/assets/img/hero-portrait-400.webp">
  <link rel="preload" as="image" href="/assets/img/hero-landscape-600.webp">
  <!-- PREVIEW of the next /get. Landing page for Meta link-click ads (/get?c=<creative>). One screen: app identity, the claim, the 9:16 + 16:9 pair, proof and the badge.
       The visitor's tap on the badge is the only way to the store: no auto-forward (Meta rejects App Store links on
       Traffic ads, and forwarding would be cloaking). Page views and badge taps are counted at the hub (/api/lp). -->
  <style>
    :root { --bg: #fff; --ink: #111; --muted: #5f5f5f; --faint: #767676; --line: rgba(0,0,0,.1); --cyan: #25d0e5; --on-cyan: #062a30; }
    .badge-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000; --ink: #fff; --muted: #b0b0b0; --faint: #949494; --line: rgba(255,255,255,.12); }
      .badge-light { display: none; } .badge-dark { display: inline; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100svh; display: flex; flex-direction: column; padding: 18px 16px 8px; }
    main { width: 100%; max-width: 420px; margin: 0 auto; text-align: center; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 0 18px; text-align: left; }
    .brand img { width: 64px; height: 64px; border-radius: 15px; }
    .brand b { display: block; font-size: 21px; letter-spacing: -.2px; }
    .brand span { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); margin-top: 3px; }
    .brand span img { width: 20px; height: 20px; border-radius: 50%; }
    h1 { font-size: 27px; line-height: 1.17; margin: 0 0 16px; letter-spacing: -.4px; }
    /* brand cyan is too pale for text on white (1.9:1), so light mode marks the phrase with a cyan bar; dark mode uses cyan text */
    h1 em { font-style: normal; padding: 0 2px; background: linear-gradient(transparent 52%, var(--cyan) 52%, var(--cyan) 80%, transparent 80%); }
    @media (prefers-color-scheme: dark) { h1 em { background: none; padding: 0; color: var(--cyan); } }
    .pair { text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .pair figure { margin: 0; }
    .pair img { display: block; border-radius: 10px; object-fit: cover; border: 1px solid var(--line); }
    .pair .v img { width: 92px; height: 164px; }
    .pair .h img { width: 206px; height: 116px; }
    .pair figcaption { font-size: 11px; color: var(--faint); margin-top: 5px; }
    .proof { font-size: 14px; color: var(--muted); margin: 18px 0 10px; }
    .proof b { color: var(--ink); } .proof i { font-style: normal; color: #f5a400; }
    .try { display: block; background: var(--cyan); color: var(--on-cyan); text-decoration: none; font-weight: 700;
      font-size: 19px; padding: 16px; border-radius: 14px; }
    .cta { display: inline-block; line-height: 0; margin: 12px 0 6px; }
    .cta img { width: 150px; height: auto; }
    .reassure { font-size: 13px; color: var(--faint); margin: 0; }
    blockquote { margin: 14px auto 0; max-width: 34ch; font-size: 14px; line-height: 1.4; color: var(--muted); }
    blockquote cite { display: block; font-style: normal; font-size: 12px; color: var(--faint); margin-top: 4px; }
    footer { margin-top: auto; padding-top: 14px; text-align: center; font-size: 11px; }
    footer a { color: var(--faint); margin: 0 6px; text-decoration: none; }
  </style>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <main>
    <div class="brand"><img src="/assets/logo-rounded-240.png" alt="" width="64" height="64"><div><b>ContentCam</b><span><img src="/assets/img/jimmy-avatar-96.webp" alt="" width="20" height="20">Made by Jimmy</span></div></div>
    <h1>Record vertical and horizontal <em>at the same time</em></h1>

    <a class="pair store" href="https://apps.apple.com/app/apple-store/id6765881795?pt=128838819&amp;ct=mt&amp;mt=8" aria-label="The same take saved as a vertical and a horizontal video">
      <figure class="v"><img id="pv" src="/assets/img/hero-portrait-400.webp" alt="Vertical 9:16 video" width="92" height="164"><figcaption>9:16 · Reels, TikTok</figcaption></figure>
      <figure class="h"><img id="pl" src="/assets/img/hero-landscape-600.webp" alt="Horizontal 16:9 video of the same take" width="206" height="116"><figcaption>16:9 · YouTube</figcaption></figure>
    </a>

    <p class="proof"><b>Rated 4.8</b> <i>★</i> · Loved by 1,000+ creators</p>
    <a class="try store" href="https://apps.apple.com/app/apple-store/id6765881795?pt=128838819&amp;ct=mt&amp;mt=8">Try it free</a>
    <a class="cta store" id="dl" href="https://apps.apple.com/app/apple-store/id6765881795?pt=128838819&amp;ct=mt&amp;mt=8"><img class="badge-light" src="/assets/app-store-badge.svg" alt="Download on the App Store" width="150" height="50"><img class="badge-dark" src="/assets/app-store-badge-white.svg" alt="Download on the App Store" width="150" height="50"></a>
    <p class="reassure">Free to download · No account needed</p>

    <blockquote>“It’s great to be able to do it in one take now!”<cite>Jessxlin · App Store review</cite></blockquote>
  </main>
  <footer><a id="play" href="https://play.google.com/store/apps/details?id=app.contentcam.android&amp;referrer=utm_source%3Dmeta%26utm_campaign%3Dmt">Android</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/support">Contact</a></footer>
  <script>
    // link-click ads land here as /get?c=<creative>: the store links carry that ad's campaign token (ct=mt-<creative>),
    // and the hub counts the page view and the badge tap so landing loss and store loss can be told apart
    (function () {
      var c = (new URLSearchParams(location.search).get("c") || "163k").replace(/[^\w-]/g, "").slice(0, 30);
      var ct = c ? "mt-" + c : "mt";
      // show the take each ad's reel demos, so the page opens on the scene the visitor just watched
      var take = { "163k": "064", "36k": "064", "37k": "064", "109k": "047" }[c];
      if (take) {
        document.getElementById("pv").src = "/assets/img/reel-" + take + "-portrait-400.webp";
        document.getElementById("pl").src = "/assets/img/reel-" + take + "-landscape-600.webp";
      }
      if (c) {
        document.querySelectorAll(".store").forEach(function (a) { a.href = "https://apps.apple.com/app/apple-store/id6765881795?pt=128838819&ct=" + ct + "&mt=8"; });
        document.getElementById("play").href = "https://play.google.com/store/apps/details?id=app.contentcam.android&referrer=" + encodeURIComponent("utm_source=meta&utm_campaign=" + ct);
      }
      // preview copy: no beacons, so viewing it doesn't count as ad traffic
    })();
  </script>
</body>
</html>
