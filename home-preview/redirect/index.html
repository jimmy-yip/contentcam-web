<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening ContentCam</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- DESIGN PREVIEW of the bio-link redirect page: no redirect here. -->
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#faf7f1;color:#101a1c;text-align:center;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .card{padding:24px;max-width:340px}
    .logo{width:88px;height:88px;border-radius:22px;display:block;margin:0 auto 22px;
      animation:swing 1.8s cubic-bezier(.65,-0.3,.3,1.3) infinite}
    @keyframes swing{0%{transform:rotate(0)}55%{transform:rotate(360deg)}100%{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){.logo{animation:none}}
    h1{font-size:19px;font-weight:600;margin:0 0 6px}
    p{margin:0 0 22px;font-size:14px;color:#5b6a6c}
    .badges{display:flex;flex-direction:column;align-items:center;gap:10px}
    .badges img{height:48px;width:auto;display:block}
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/assets/logo-rounded-240.png" alt="ContentCam" width="88" height="88">
    <h1>Opening ContentCam…</h1>
    <p>If nothing happens, tap your store:</p>
    <div class="badges">
      <a href="https://apps.apple.com/app/apple-store/id6765881795?pt=128838819&amp;ct=jimmy&amp;mt=8"><img src="/assets/app-store-badge.svg" alt="Download on the App Store" width="144" height="48"></a>
      <a href="https://play.google.com/store/apps/details?id=app.contentcam.android&amp;referrer=utm_source%3Djimmy"><img src="/assets/google-play-badge.webp" alt="Get it on Google Play" width="162" height="48"></a>
    </div>
  </div>
</body>
</html>
