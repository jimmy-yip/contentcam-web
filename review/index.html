<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rate ContentCam</title>
  <meta name="robots" content="noindex">
  <!-- Review deep link. iOS -> App Store write-review composer; Android -> Play listing (rate stars).
       (Google Play has no web URL that opens the review dialog directly, so the listing is the closest.) -->
  <meta http-equiv="refresh" content="0; url=https://apps.apple.com/app/id6765881795?action=write-review">
  <link rel="preload" as="image" href="/assets/logo-cc-240.png">
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#faf7f1;color:#101a1c;text-align:center;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .card{padding:24px;max-width:340px}
    .logo{width:96px;height:96px;display:block;margin:0 auto 18px;
      animation:swing 1.64s cubic-bezier(.65,-0.3,.3,1.3) infinite}
    @keyframes swing{0%{transform:rotate(0)}60%{transform:rotate(360deg)}100%{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){.logo{animation:none}}
    h1{font-size:19px;font-weight:600;margin:0 0 6px}
    p{margin:0 0 22px;font-size:14px;color:#5b6a6c;line-height:1.5}
    .badges{display:flex;flex-direction:column;align-items:center;gap:10px}
    .badges img{height:48px;width:auto;display:block}
  </style>
  <script>
    (function () {
      var ios = "https://apps.apple.com/app/id6765881795?action=write-review";
      // Android: prefer the Play Store app via market://, fall back to web listing.
      var androidMarket = "market://details?id=app.contentcam.android";
      var androidWeb = "https://play.google.com/store/apps/details?id=app.contentcam.android&referrer=utm_source%3Dwebsite%26utm_campaign%3Dreview";
      var ua = navigator.userAgent || "";
      if (/android/i.test(ua)) {
        // try the native Play Store app first; if it doesn't take, fall to web
        var t = Date.now();
        location.href = androidMarket;
        setTimeout(function () {
          if (Date.now() - t < 2000) location.replace(androidWeb);
        }, 400);
      } else {
        location.replace(ios);
      }
    })();
  </script>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="card">
    <img class="logo" src="/assets/logo-cc-240.png" alt="ContentCam" width="96" height="96">
    <h1>Opening your review…</h1>
    <p>Thanks for rating ContentCam! 🩵 If nothing happens, tap your store:</p>
    <div class="badges">
      <a href="https://apps.apple.com/app/id6765881795?action=write-review"><img src="/assets/app-store-badge.svg" alt="Download on the App Store" width="144" height="48"></a>
      <a href="https://play.google.com/store/apps/details?id=app.contentcam.android&amp;referrer=utm_source%3Dwebsite%26utm_campaign%3Dreview"><img src="/assets/google-play-badge.webp" alt="Get it on Google Play" width="162" height="48"></a>
    </div>
  </div>
</body>
</html>
