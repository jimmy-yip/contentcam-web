<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rate ContentCam</title>
  <meta name="robots" content="noindex">
  <!-- Review deep link. iOS -> App Store write-review composer; Android -> Play listing (rate stars).
       (Google Play has no web URL that opens the review dialog directly — listing is the closest.) -->
  <meta http-equiv="refresh" content="0; url=https://apps.apple.com/app/id6765881795?action=write-review">
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#12c4de;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;text-align:center}
    a{color:#fff}
    .card{padding:24px;max-width:340px}
    .sp{margin-top:14px;font-size:14px;opacity:.9;line-height:1.5}
  </style>
  <script>
    (function () {
      var ios = "https://apps.apple.com/app/id6765881795?action=write-review";
      // Android: prefer the Play Store app via market://, fall back to web listing.
      var androidMarket = "market://details?id=app.contentcam.android";
      var androidWeb = "https://play.google.com/store/apps/details?id=app.contentcam.android";
      var ua = navigator.userAgent || "";
      if (/android/i.test(ua)) {
        // try the native Play Store app first; if it doesn't take, fall to web
        var t = Date.now();
        location.href = androidMarket;
        setTimeout(function () {
          if (Date.now() - t < 2000) location.replace(androidWeb);
        }, 400);
      } else {
        location.replace(ios);
      }
    })();
  </script>
</head>
<body>
  <div class="card">
    <p style="font-size:18px;font-weight:600">Opening your review…</p>
    <p class="sp">Thanks for rating ContentCam! 🤍<br>
      If it didn't open:
      <a href="https://apps.apple.com/app/id6765881795?action=write-review">iPhone</a> ·
      <a href="https://play.google.com/store/apps/details?id=app.contentcam.android">Android</a>
    </p>
  </div>
</body>
</html>
