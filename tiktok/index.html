<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ContentCam — Dual Camera Video</title>
  <meta name="robots" content="noindex">
  <!-- Brand TikTok bio link. Device-routes: iOS -> App Store (ct=TikTok attribution), Android -> Play. -->
  <meta http-equiv="refresh" content="0; url=https://apps.apple.com/app/apple-store/id6765881795?pt=128838819&ct=TikTok&mt=8">
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#12c4de;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;text-align:center}
    a{color:#fff}
    .card{padding:24px}
    .sp{margin-top:14px;font-size:14px;opacity:.85}
  </style>
  <script>
    (function () {
      var ios = "https://apps.apple.com/app/apple-store/id6765881795?pt=128838819&ct=TikTok&mt=8";
      var android = "https://play.google.com/store/apps/details?id=app.contentcam.android&referrer=utm_source%3Dtiktok";
      var ua = navigator.userAgent || "";
      var dest = /android/i.test(ua) ? android : ios;
      location.replace(dest);
    })();
  </script>
</head>
<body>
  <div class="card">
    <p style="font-size:18px;font-weight:600">Opening ContentCam…</p>
